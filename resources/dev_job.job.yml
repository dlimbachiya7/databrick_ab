# Job for databricks_ab. and added second task for product insights.
resources:
  jobs:
    dev_job:
      name: dev_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_orc
          notebook_task:
            notebook_path: ../src/jobs/franchise_insights.ipynb
          environment_key: default
        - task_key: prod_insights_orc
          notebook_task:
            notebook_path: ../src/jobs/product_insights.ipynb
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"