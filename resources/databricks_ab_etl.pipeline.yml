# The main pipeline for databricks_ab

resources:
  pipelines:
    databricks_ab_etl:
      name: databricks_ab_etl
      # Catalog is required for serverless compute
      catalog: main
      schema: ${var.schema}
      serverless: true
      root_path: "../src/databricks_ab_etl"

      libraries:
        - glob:
            include: ../src/databricks_ab_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
