# This is a Databricks asset bundle definition for databricks_ab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_ab
  uuid: b630b230-8313-451a-8b53-59794e56a86a

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405608618605810.10.azuredatabricks.net
    variables:
      catalog: hive_metastore
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405608618605810.10.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/a6e3e65d-a866-4a6f-991d-d398417d1676 to make sure we only have a single copy.
      root_path: /Workspace/Users/a6e3e65d-a866-4a6f-991d-d398417d1676/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hive_metastore
      schema: prod
    permissions:
      - service_principal_name: a6e3e65d-a866-4a6f-991d-d398417d1676
        level: CAN_MANAGE
